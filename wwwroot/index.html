<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Booking API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-5cwHzSvxU9Aan6gw6XjE5ZsI6UgeN1l18XvP0BsXRghTdEBtYowAcDFIms3YQ6w5" crossorigin="anonymous">
    <link rel="stylesheet" href="css/site.css" />
</head>
<body>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3">Hotel Booking</h1>
                <p class="text-muted mb-0">ASP.NET Core Web API + Bootstrap frontend</p>
            </div>
            <button class="btn btn-primary" onclick="refreshAll()">Refresh all</button>
        </div>

        <ul class="nav nav-pills mb-3" id="pageTabs" role="tablist">
            <li class="nav-item" role="presentation"><button class="nav-link active" id="room-types-tab" data-bs-toggle="pill" data-bs-target="#room-types" type="button" role="tab">Room Types</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" id="rooms-tab" data-bs-toggle="pill" data-bs-target="#rooms" type="button" role="tab">Rooms</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" id="guests-tab" data-bs-toggle="pill" data-bs-target="#guests" type="button" role="tab">Guests</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" id="bookings-tab" data-bs-toggle="pill" data-bs-target="#bookings" type="button" role="tab">Bookings</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="room-types" role="tabpanel">
                <div class="d-flex justify-content-between mb-3">
                    <h2>Room Types</h2>
                    <button class="btn btn-success" onclick="showRoomTypeModal()">Add Room Type</button>
                </div>
                <div class="mb-3 row g-2 align-items-center">
                    <div class="col-auto"><label class="col-form-label">Search:</label></div>
                    <div class="col"><input id="searchRoomTypes" type="text" class="form-control" placeholder="Search room types" oninput="filterTable('roomTypesTable', this.value)" /></div>
                </div>
                <div class="table-responsive">
                    <table class="table table-bordered table-hover" id="roomTypesTable">
                        <thead class="table-light"><tr><th>Name</th><th>Capacity</th><th>Price</th><th>Actions</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="tab-pane fade" id="rooms" role="tabpanel">
                <div class="d-flex justify-content-between mb-3">
                    <h2>Rooms</h2>
                    <button class="btn btn-success" onclick="showRoomModal()">Add Room</button>
                </div>
                <div class="mb-3 row g-2 align-items-center">
                    <div class="col-auto"><label class="col-form-label">Search:</label></div>
                    <div class="col"><input id="searchRooms" type="text" class="form-control" placeholder="Search rooms" oninput="filterTable('roomsTable', this.value)" /></div>
                </div>
                <div class="table-responsive">
                    <table class="table table-bordered table-hover" id="roomsTable">
                        <thead class="table-light"><tr><th>Number</th><th>Floor</th><th>Available</th><th>Type</th><th>Price</th><th>Actions</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="tab-pane fade" id="guests" role="tabpanel">
                <div class="d-flex justify-content-between mb-3">
                    <h2>Guests</h2>
                    <button class="btn btn-success" onclick="showGuestModal()">Add Guest</button>
                </div>
                <div class="mb-3 row g-2 align-items-center">
                    <div class="col-auto"><label class="col-form-label">Search:</label></div>
                    <div class="col"><input id="searchGuests" type="text" class="form-control" placeholder="Search guests" oninput="filterTable('guestsTable', this.value)" /></div>
                </div>
                <div class="table-responsive">
                    <table class="table table-bordered table-hover" id="guestsTable">
                        <thead class="table-light"><tr><th>Name</th><th>Email</th><th>Phone</th><th>Actions</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="tab-pane fade" id="bookings" role="tabpanel">
                <div class="d-flex justify-content-between mb-3">
                    <h2>Bookings</h2>
                    <button class="btn btn-success" onclick="showBookingModal()">Add Booking</button>
                </div>
                <div class="mb-3 row g-2 align-items-center">
                    <div class="col-auto"><label class="col-form-label">Search:</label></div>
                    <div class="col"><input id="searchBookings" type="text" class="form-control" placeholder="Search bookings" oninput="filterTable('bookingsTable', this.value)" /></div>
                </div>
                <div class="table-responsive">
                    <table class="table table-bordered table-hover" id="bookingsTable">
                        <thead class="table-light"><tr><th>Guest</th><th>Room</th><th>Check In</th><th>Check Out</th><th>Total</th><th>Actions</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal fade" id="roomTypeModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="roomTypeForm" onsubmit="saveRoomType(event)">
                    <div class="modal-header"><h5 class="modal-title" id="roomTypeModalLabel">Add Room Type</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                    <div class="modal-body">
                        <input type="hidden" id="roomTypeId" />
                        <div class="mb-3"><label class="form-label">Name</label><input id="roomTypeName" class="form-control" required maxlength="100" /></div>
                        <div class="mb-3"><label class="form-label">Capacity</label><input id="roomTypeCapacity" type="number" class="form-control" min="1" required /></div>
                        <div class="mb-3"><label class="form-label">Price per night</label><input id="roomTypePrice" type="number" step="0.01" class="form-control" min="0" required /></div>
                    </div>
                    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="roomModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="roomForm" onsubmit="saveRoom(event)">
                    <div class="modal-header"><h5 class="modal-title" id="roomModalLabel">Add Room</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                    <div class="modal-body">
                        <input type="hidden" id="roomId" />
                        <div class="mb-3"><label class="form-label">Number</label><input id="roomNumber" class="form-control" required maxlength="20" /></div>
                        <div class="mb-3"><label class="form-label">Floor</label><input id="roomFloor" type="number" class="form-control" min="1" required /></div>
                        <div class="mb-3"><label class="form-label">Room type</label><select id="roomTypeSelect" class="form-select" required></select></div>
                        <div class="form-check"><input id="roomAvailable" class="form-check-input" type="checkbox" checked /><label class="form-check-label" for="roomAvailable">Available</label></div>
                    </div>
                    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="guestModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="guestForm" onsubmit="saveGuest(event)">
                    <div class="modal-header"><h5 class="modal-title" id="guestModalLabel">Add Guest</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                    <div class="modal-body">
                        <input type="hidden" id="guestId" />
                        <div class="mb-3"><label class="form-label">First name</label><input id="guestFirstName" class="form-control" required maxlength="100" /></div>
                        <div class="mb-3"><label class="form-label">Last name</label><input id="guestLastName" class="form-control" required maxlength="100" /></div>
                        <div class="mb-3"><label class="form-label">Email</label><input id="guestEmail" type="email" class="form-control" required maxlength="200" /></div>
                        <div class="mb-3"><label class="form-label">Phone</label><input id="guestPhone" class="form-control" required maxlength="50" /></div>
                    </div>
                    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="bookingModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="bookingForm" onsubmit="saveBooking(event)">
                    <div class="modal-header"><h5 class="modal-title" id="bookingModalLabel">Add Booking</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                    <div class="modal-body">
                        <input type="hidden" id="bookingId" />
                        <div class="mb-3"><label class="form-label">Guest</label><select id="bookingGuest" class="form-select" required></select></div>
                        <div class="mb-3"><label class="form-label">Room</label><select id="bookingRoom" class="form-select" required></select></div>
                        <div class="mb-3"><label class="form-label">Check-in</label><input id="bookingCheckIn" type="date" class="form-control" required /></div>
                        <div class="mb-3"><label class="form-label">Check-out</label><input id="bookingCheckOut" type="date" class="form-control" required /></div>
                    </div>
                    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
                </form>
            </div>
        </div>
    </div>

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
        <div id="toastContainer" class="toast align-items-center text-bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex"><div class="toast-body" id="toastMessage"></div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1M1moOpiOL0n8QlS3FVqZ24mgtb4E4RfFJ4F6LVi/A6f+NWk/5eCf4l2k1Ea5kOx" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
</html>
